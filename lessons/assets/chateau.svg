<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 958" role="img" aria-label="Château fort">
  <image href="lessons/img/histoire-moyen-age/schema-chateau.jpg" width="1400" height="958"/>
  <!-- Zones à toucher, invisibles (?zones=1 pour les voir). Ordre = du fond vers le devant. -->
  <g fill="transparent" stroke="transparent">
    <g data-zone="douves" class="zone"><ellipse cx="700" cy="520" rx="695" ry="435"/></g>
    <!-- île et pied du château : pas une zone -->
    <polygon points="130,420 220,300 380,170 1000,170 1200,250 1265,470 1250,760 1060,800 800,780 600,780 330,770 200,690 165,560"/>
    <g data-zone="cour" class="zone"><polygon points="385,285 1050,270 1062,462 830,470 830,440 575,440 575,465 365,450"/></g>
    <g data-zone="remparts" class="zone">
      <polygon points="380,185 1000,180 1005,275 385,290"/>
      <polygon points="300,240 385,215 380,460 330,600 300,560"/>
      <polygon points="1000,215 1080,245 1075,470 1060,470"/>
      <polygon points="330,470 578,470 578,610 330,610"/>
      <polygon points="832,485 1060,485 1060,600 832,600"/>
    </g>
    <g data-zone="chemin-de-ronde" class="zone">
      <polygon points="330,432 578,432 578,470 330,470"/>
      <polygon points="832,452 1060,452 1060,485 832,485"/>
      <polygon points="1080,300 1180,300 1180,455 1110,455"/>
    </g>
    <g data-zone="donjon" class="zone"><polygon points="630,70 765,70 765,345 630,345"/></g>
    <g data-zone="tour" class="zone">
      <ellipse cx="295" cy="535" rx="80" ry="160"/>
      <ellipse cx="1145" cy="605" rx="105" ry="170"/>
      <ellipse cx="398" cy="258" rx="52" ry="92"/>
      <ellipse cx="1135" cy="300" rx="58" ry="45"/>
    </g>
    <g data-zone="entree" class="zone"><polygon points="578,440 835,440 835,605 760,605 760,470 655,470 655,605 578,605"/></g>
    <g data-zone="herse" class="zone"><rect x="655" y="470" width="105" height="125"/></g>
    <g data-zone="pont-levis" class="zone"><polygon points="648,595 762,595 772,935 606,935"/></g>
  </g>
</svg>
